    <script>
      // Make window.fetch safely writable/extensible in sandboxed/iframe preview environments
      try {
        if (typeof window !== 'undefined' && window.fetch) {
          const nativeFetch = window.fetch.bind(window);
          let currentFetch = nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get() {
              return currentFetch;
            },
            set(newFetch) {
              currentFetch = typeof newFetch === 'function' ? newFetch : nativeFetch;
            },
            configurable: true,
            enumerable: true,
          });
        }
      } catch (e) {
        console.warn('Fetch setter initialization:', e);
      }
    </script>
